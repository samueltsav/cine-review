<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movies</title>
    <link rel="stylesheet" href="css/movies.css">
    <link rel="stylesheet" href="css/details.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/img/favicon.ico">
    <!-- css -->
    <link rel="stylesheet" href="./css/landing_style.css" />
    <!-- fontawesome libary  -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/fontawesome.min.css"
        integrity="sha512-M5Kq4YVQrjg5c2wsZSn27Dkfm/2ALfxmun0vUE3mPiJyK53hQBHYCVAtvMYEC7ZXmYLg8DVG4tF8gD27WmDbsg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/js/fontawesome.min.js"
        integrity="sha512-obFNtQ1JKCrxPBPLmYDUevlriATl5EhvwU3CFtdW/HKOkeAe0bbsyZfHO44/f1QyndrZJ464TQvrRP9ZjyXSSA=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="js/partials.js" defer></script>

</head>

<body>

    <!-- Header / Navbar -->
    <header class="navbar">
        <nav id="navbar"></nav>
    </header>

    <!-- Hero Section -->
    <section class="movies-hero">
        <h1>All Movies</h1>
        <p>Discover and review amazing films</p>
    </section>

    <!-- Filters Section -->
    <section class="filters">
        <!-- Search -->
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass search-icon"></i>
            <input id="search-input" type="text" placeholder="Search movies..." />
        </div>

        <!-- Filter Controls -->
        <div class="filter-controls">
            <div class="filter-group" >
                <label>Genre:</label>
                <select id="genreFilter">
                    <option value="all">All Genres</option>
                    <option value="Sci-Fi">Sci-Fi</option>
                    <option value="Drama">Drama</option>
                    <option value="Thriller">Thriller</option>
                    <option value="Horror">Horror</option>
                    <option value="Animation">Animation</option>
                </select>
            </div>

            <div class="filter-group">
                <label>Min Rating:</label>
                <select id="ratingFilter">
                    <option value="All Ratings">All Ratings</option>
                    <option value="1">1+ star</option>
                    <option value="2">2+ stars</option>
                    <option value="3">3+ stars</option>
                    <option value="4">4+ stars</option>
                    <option value="5">5 stars</option>
                </select>
            </div>

            <div class="filter-group">
                <label>Sort By:</label>
                <select id="sortByFilter">
                    <option value="default">Sort By</option>
                    <option value="rating-high">Highest Rating</option>
                    <option value="rating-low">Lowest Rating</option>
                    <option value="year">Year</option>
                    <option value="title">Title</option>
                </select>
            </div>

            <button class="clear-btn" id="clear-filters">Clear Filters</button>
        </div>
    </section>

    <!-- Results Info -->
    <section class="results-info">
        <p id="results-count">Showing 0 movies</p>
    </section>

    <!-- Empty State -->
    <section class="empty-state" id="empty-state">
        <div class="empty-icon"></div>
        <h3>No movies found</h3>
        <p>Try adjusting your filters or search terms</p>
    </section>

    <!-- Movies Grid -->
    <section id="movies-grid-container">
        <div id="movies-grid"></div>
    </section>

    <!--Movie Details Model-->
    <div id="details-overlay" class="model-overlay" aria-hidden="true">
        <div id="details-model" class="model" role="dialog" aria-model="true" tabindex="-1">
            <button id="details-close" class="model__close" aria-label="Close">×</button>

            <div class="details">
                <img id="details-poster" class="details__poster" alt="" />

                <div class="details__content">
                    <h2 id="details-title" class="details__title"></h2>

                    <div class="details__meta" id="details-meta"></div>

                    <div class="details__rating">
                        <span id="details-stars" class="stars"></span>
                        <span id="details-rating-text" class="rating-text"></span>
                    </div>

                    <div class="details__actions">
                        <button id="details-write-review" class="btn btn--primary">Write Review</button>
                        <button id="details-watchlist" class="btn btn--ghost" aria-pressed="false">Add to
                            Watchlist</button>
                    </div>

                    <div class="details__divider"></div>

                    <h3 class="details__section-title">Synopsis</h3>
                    <p id="details-description" class="details__text"></p>

                    <h3 class="details__section-title">Director</h3>
                    <p id="details-director" class="details__text"></p>

                    <h3 class="details__section-title">Cast</h3>
                    <div id="details-cast" class="pill-row"></div>

                    <h3 class="details__section-title">Reviews (<span id="details-review-count">0</span>)</h3>
                    <div id="details-reviews" class="reviews-list"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- review model -->
    <div id="review-overlay" class="model-overlay" aria-hidden="true">
        <div class="model model--small" role="dialog" aria-model="true" aria-labelledby="review-title" tabindex="-1">
            <button id="review-close" class="model__close" aria-label="Close">×</button>

            <div class="review-model">
                <h2 id="review-title" class="details__title">Write a Review</h2>

                <form id="review-form" class="form">
                    <label class="form__label">
                        Your name
                        <input id="reviewer" class="form__input" required />
                    </label>

                    <label class="form__label">
                        Rating (1–5)
                        <input id="rating" class="form__input" type="number" min="1" max="5" value="5" required />
                    </label>

                    <label class="form__label">
                        Comment
                        <textarea id="comment" class="form__textarea" rows="4" required></textarea>
                    </label>

                    <div class="form__actions">
                        <button type="button" id="review-cancel" class="btn btn--ghost">Cancel</button>
                        <button type="submit" class="btn btn--primary">Submit</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <footer id="footer"></footer>

    <script src="./js/details.js"></script>
    <script src="./js/movies.js"></script>
</body>

</html>
